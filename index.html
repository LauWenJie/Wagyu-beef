<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Khyra ❤️</title>

<style>
body {
  margin: 0;
  height: 100vh;
  overflow: hidden;
  background: linear-gradient(#ffd6e7, #fff);
  display: flex;
  justify-content: center;
  align-items: center;
  font-family: Arial, sans-serif;
}

.container {
  text-align: center;
}

h1 {
  color: #ff4d88;
  font-size: 40px;
  animation: pulse 1.5s infinite;
}

.cat {
  font-size: 120px;
  animation: move 3s infinite;
}

.kiss {
  font-size: 60px;
  animation: kiss 2s infinite;
}

p {
  font-size: 22px;
  color: #555;
}

.heart {
  position: absolute;
  font-size: 30px;
  animation: float 5s linear infinite;
}

@keyframes pulse {
  50% { transform: scale(1.15); }
}

@keyframes move {
  50% { transform: translateY(-20px); }
}

@keyframes kiss {
  50% { transform: scale(1.4); }
}

@keyframes float {
  from {
    bottom: -50px;
    opacity: 1;
  }
  to {
    bottom: 100vh;
    opacity: 0;
  }
}
</style>
</head>

<body>

<div class="container">

<h1>For Khyra ❤️</h1>

<div class="cat">🐱</div>

<div class="kiss">💋</div>

<p>
For my favourite person, Khyra ❤️<br>
A little kiss just for you 🐱💋
</p>

</div>

<script>
setInterval(() => {
 let heart = document.createElement("div");
 heart.className="heart";
 heart.innerHTML="❤️";
 heart.style.left=Math.random()*100+"vw";
 heart.style.animationDuration=(3+Math.random()*3)+"s";
 document.body.appendChild(heart);

 setTimeout(()=>{
  heart.remove();
 },5000);

},500);
</script>

</body>
</html>
