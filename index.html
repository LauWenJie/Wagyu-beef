<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MedFit Dashboard</title>

<style>
body {
  margin:0;
  font-family:Arial;
  background:#121212;
  color:white;
}

.container {
  padding:20px;
}

.card {
  background:#1f1f1f;
  border-radius:15px;
  padding:20px;
  margin-bottom:15px;
}

h1 {
  text-align:center;
  color:#4dd0e1;
}

input, button {
  padding:10px;
  border-radius:8px;
  border:none;
  margin:5px;
}

input {
  width:70%;
}

button {
  background:#4dd0e1;
  cursor:pointer;
}

.item {
  margin:10px 0;
}

.progress {
  font-size:30px;
  color:#81c784;
}
</style>

</head>

<body>

<div class="container">

<h1>🩺 MedFit Dashboard</h1>


<div class="card">
<h2>🏋️ Workout Log</h2>

<input id="workout" placeholder="Example: Bench 80kg x5">
<button onclick="addWorkout()">Add</button>

<div id="workouts"></div>
</div>



<div class="card">
<h2>🍗 Protein Tracker</h2>

<input id="protein" placeholder="Protein (g)">
<button onclick="addProtein()">Add</button>

<p class="progress">
<span id="totalProtein">0</span> / 150g
</p>

</div>



<div class="card">
<h2>⚖️ Weight</h2>

<input id="weight" placeholder="Weight kg">
<button onclick="saveWeight()">Save</button>

<p id="weightDisplay"></p>
</div>



<div class="card">
<h2>✅ Today's Checklist</h2>

<div class="item">
<input type="checkbox"> Review lectures
</div>

<div class="item">
<input type="checkbox"> Gym
</div>

<div class="item">
<input type="checkbox"> Read medicine notes
</div>

</div>


</div>


<script>

let protein=0;

function addWorkout(){
let text=document.getElementById("workout").value;

let p=document.createElement("p");
p.innerHTML="💪 "+text;

document.getElementById("workouts").appendChild(p);

document.getElementById("workout").value="";
}


function addProtein(){

let amount=parseInt(document.getElementById("protein").value);

protein+=amount;

document.getElementById("totalProtein").innerHTML=protein;

}


function saveWeight(){

let w=document.getElementById("weight").value;

document.getElementById("weightDisplay").innerHTML=
"Current weight: "+w+" kg";

}

</script>


</body>
</html>
