<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MedFit Dashboard</title>

<style>
body{
margin:0;
font-family:Arial;
background:#101010;
color:white;
}

.container{
padding:20px;
}

h1{
text-align:center;
color:#4dd0e1;
}

.card{
background:#1e1e1e;
padding:20px;
border-radius:15px;
margin-bottom:15px;
}

input,button,select{
padding:10px;
border-radius:8px;
border:none;
margin:4px;
}

button{
background:#4dd0e1;
}

.stat{
font-size:20px;
margin:8px;
}

.item{
background:#292929;
padding:10px;
margin:5px;
border-radius:8px;
}

</style>
</head>


<body>

<div class="container">

<h1>🩺 MedFit Dashboard</h1>


<div class="card">

<h2>🔥 Today's Nutrition</h2>

<div class="stat">
Calories: <span id="calories">0</span> kcal
</div>

<div class="stat">
🍗 Protein: <span id="protein">0</span> g
</div>

<div class="stat">
🍚 Carbs: <span id="carbs">0</span> g
</div>

<div class="stat">
🥑 Fat: <span id="fat">0</span> g
</div>

</div>



<div class="card">

<h2>🍽 Add Food</h2>

<input id="food" placeholder="Food">

<input id="cal" placeholder="Calories">

<input id="pro" placeholder="Protein">

<input id="carb" placeholder="Carbs">

<input id="fatInput" placeholder="Fat">

<button onclick="addFood()">Add</button>

<div id="foods"></div>

</div>



<div class="card">

<h2>⚖️ Weight Tracker</h2>

<input id="weight" placeholder="Weight kg">

<button onclick="saveWeight()">Save</button>

<p id="weightDisplay"></p>

</div>



<div class="card">

<h2>🏋️ Workout Log</h2>

<input id="workout" placeholder="Example: Squat 120kg x5">

<button onclick="addWorkout()">Add</button>

<div id="workouts"></div>

</div>



<div class="card">

<h2>🧮 TDEE Calculator</h2>

<input id="age" placeholder="Age">

<input id="height" placeholder="Height cm">

<input id="bodyweight" placeholder="Weight kg">


<select id="activity">
<option value="1.2">Low activity</option>
<option value="1.55">Moderate</option>
<option value="1.725">High activity</option>
</select>


<button onclick="calculateTDEE()">Calculate</button>

<p id="tdee"></p>

</div>



</div>


<script>

let data = JSON.parse(localStorage.getItem("medfit")) || {
cal:0,
protein:0,
carbs:0,
fat:0,
foods:[],
workouts:[]
};


function save(){
localStorage.setItem("medfit",JSON.stringify(data));
}


function update(){

calories.innerHTML=data.cal;
protein.innerHTML=data.protein;
carbs.innerHTML=data.carbs;
fat.innerHTML=data.fat;

foods.innerHTML=data.foods.map(x=>"<div class='item'>🍽 "+x+"</div>").join("");

workouts.innerHTML=data.workouts.map(x=>"<div class='item'>💪 "+x+"</div>").join("");

}



function addFood(){

let name=food.value;

data.cal+=Number(cal.value);
data.protein+=Number(pro.value);
data.carbs+=Number(carb.value);
data.fat+=Number(fatInput.value);

data.foods.push(
name+" ("+cal.value+" kcal)"
);

save();
update();

}



function saveWeight(){

localStorage.setItem(
"weight",
weight.value
);

weightDisplay.innerHTML=
"Current weight: "+weight.value+" kg";

}



function addWorkout(){

data.workouts.push(workout.value);

save();
update();

}



function calculateTDEE(){

let a=Number(age.value);
let h=Number(height.value);
let w=Number(bodyweight.value);

let bmr=
10*w+
6.25*h-
5*a+
5;

let result=
bmr*
Number(activity.value);


tdee.innerHTML=
"Maintenance: "+Math.round(result)+" kcal/day";

}


update();

</script>


</body>
</html>
